<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GROUND UP &mdash; A Life &amp; Economy Simulator</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header id="hud">
  <div class="hud-left">
    <span class="brand">GROUND <span class="brand-accent">UP</span></span>
    <span class="hud-day" id="hud-day">Day 1 · Morning</span>
  </div>
  <div class="hud-mid">
    <div class="need-icons">
      <div class="need-bar" id="need-hunger" title="Hunger"><span>🍽️</span><div class="need-track"><div class="need-fill ok"></div></div></div>
      <div class="need-bar" id="need-energy" title="Energy"><span>⚡</span><div class="need-track"><div class="need-fill ok"></div></div></div>
      <div class="need-bar" id="need-hygiene" title="Hygiene"><span>🧼</span><div class="need-track"><div class="need-fill ok"></div></div></div>
      <div class="need-bar" id="need-warmth" title="Warmth"><span>🔥</span><div class="need-track"><div class="need-fill ok"></div></div></div>
    </div>
  </div>
  <div class="hud-right">
    <div class="hud-stat">
      <span class="hud-label">Net Worth</span>
      <span class="hud-value" id="hud-cash">$8.00</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">Status</span>
      <span class="hud-value" id="hud-status">Homeless</span>
    </div>
    <div class="hud-stat hud-progress">
      <span class="hud-label"><span id="hud-tier-progress-label">Next Tier</span></span>
      <div class="progress-bar"><div class="progress-fill" id="hud-tier-progress"></div></div>
    </div>
    <div class="hud-stat">
      <span class="hud-label">Phone</span>
      <span class="hud-value" id="hud-battery">5%</span>
    </div>
  </div>
</header>

<nav id="main-nav">
  <button data-screen="city" class="nav-btn active">🏙️ City</button>
  <button data-screen="phone" class="nav-btn">📱 Phone</button>
  <button data-screen="character" class="nav-btn">🎒 You</button>
  <button data-screen="housing" class="nav-btn">🏠 Housing</button>
  <button data-screen="shop" class="nav-btn">🛍️ Shop</button>
  <button data-screen="progress" class="nav-btn">🏆 Progress</button>
</nav>

<main id="app"></main>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
